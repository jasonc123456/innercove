# Runs on every push and PR. A red X means main is broken: fix it before
# merging more (AGENTS.md "Git"). Not a required check, so it never blocks a push.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Web component tests (run by the root vitest) import react from web/node_modules.
      - run: npm install --no-audit --no-fund --prefix web
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: node scripts/check-safety.mjs
      - run: python3 -m py_compile scripts/run_eval.py scripts/smoke-inference.py

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  secrets:
    # The repo is public (D40): fail if a key, token or .env lands in any commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
